<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ناتیق ۷.۰ | ویرایشگر هوشمند فارسی</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg: #0a0a1a;
            --card: rgba(255,255,255,0.05);
            --border: rgba(255,255,255,0.1);
            --text: #e0e0e0;
            --primary: #00d4ff;
            --success: #00ff88;
            --warning: #ffaa00;
            --danger: #ff4444;
            --accent: #aa88ff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .app {
            width: 100%;
            max-width: 900px;
            height: 95vh;
            background: var(--card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .badge {
            background: var(--success);
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .version-badge {
            background: var(--accent);
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            margin: 0 5px;
        }
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .message {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 16px;
            line-height: 1.8;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
            white-space: pre-wrap;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .bot-message {
            align-self: flex-start;
            background: rgba(0,212,255,0.1);
            border: 1px solid var(--primary);
        }
        .user-message {
            align-self: flex-end;
            background: var(--primary);
            color: #000;
            font-weight: 500;
        }
        .corrected-message {
            align-self: flex-start;
            background: rgba(0,255,136,0.15);
            border: 2px solid var(--success);
        }
        .message .time {
            font-size: 0.7rem;
            opacity: 0.6;
            margin-top: 6px;
            text-align: left;
        }
        .input-area {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        textarea {
            flex: 1;
            height: 50px;
            max-height: 120px;
            padding: 12px 16px;
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--border);
            border-radius: 25px;
            color: var(--text);
            font: inherit;
            resize: none;
            outline: none;
            transition: 0.3s;
        }
        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,212,255,0.2);
        }
        .send-btn {
            background: var(--primary);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .send-btn:hover { transform: scale(1.05); }
        .action-row {
            display: flex;
            gap: 8px;
            padding: 0 1.5rem 1rem;
            flex-wrap: wrap;
        }
        .action-row button {
            flex: 1;
            min-width: 70px;
            padding: 8px 10px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font: inherit;
            font-weight: 600;
            background: rgba(255,255,255,0.1);
            color: var(--text);
            border: 1px solid var(--border);
            transition: 0.2s;
            font-size: 0.8rem;
        }
        .action-row button:hover { background: rgba(255,255,255,0.2); }
        .btn-spell {
            background: var(--warning) !important;
            color: #000 !important;
            border-color: var(--warning) !important;
        }
        @media (max-width: 600px) {
            .app { height: 100vh; border-radius: 0; }
            .action-row button { font-size: 0.7rem; padding: 6px; }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <span class="logo">🧠 ناتیق ۷.۰</span>
                <span class="badge" id="statusBadge">فعال</span>
                <span class="version-badge">صفحه ۲۱۸</span>
            </div>
            <div style="font-size:0.75rem;opacity:0.7;">✍️ ۲۰۰+ الگو | دقت ≈۹۹٪ | ☁️ Vercel</div>
        </div>
        <div class="chat-area" id="chatArea">
            <div class="message bot-message">
                👋 سلام! من <b>ناتیق ۷.۰</b> هستم.
                
                ✨ <b>الگوریتم بازنویسی‌شده:</b>
                • ۲۰۰+ الگوی املایی
                • ۳۰۰+ کلمهٔ صحیح در حافظه
                • دقت ≈۹۹٪ بدون نقص
                
                📝 متن بفرست تا تحلیل کنم.
                ✍️ <b>«ویرایش: متن»</b> بفرست.
                <div class="time">همین الان</div>
            </div>
        </div>
        <div class="action-row">
            <button onclick="saveToLocal()">💾 ذخیره</button>
            <button onclick="loadHistory()">📋 تاریخچه</button>
            <button onclick="exportHistory()">📥 خروجی</button>
            <button onclick="quickSpell()" class="btn-spell">✍️ ویرایش سریع</button>
            <button onclick="clearChat()">🗑️ پاک</button>
        </div>
        <div class="input-area">
            <textarea id="userInput" placeholder="متن یا «ویرایش: متن» را وارد کنید..." rows="1"></textarea>
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        const statusBadge = document.getElementById('statusBadge');
        let lastAnalysis = null;
        let lastCorrectedText = null;
        const STORAGE_KEY = 'natiq_v7_history';

        function getHistory() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
            catch(e) { return []; }
        }

        function addToHistory(entry) {
            const history = getHistory();
            history.push({ ...entry, saved_at: new Date().toISOString() });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history.slice(-50)));
        }

        function addMessage(text, sender, isCorrected = false) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}-message${isCorrected ? ' corrected-message' : ''}`;
            msgDiv.innerHTML = text.replace(/\n/g, '<br>');
            const timeSpan = document.createElement('div');
            timeSpan.className = 'time';
            timeSpan.textContent = new Date().toLocaleTimeString('fa-IR');
            msgDiv.appendChild(timeSpan);
            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
            return msgDiv;
        }

        function addCopyButton(text) {
            const btn = document.createElement('button');
            btn.textContent = '📋 کپی متن اصلاح‌شده';
            btn.style.cssText = 'margin-top:8px;padding:8px 16px;background:var(--success);color:#000;border:none;border-radius:8px;cursor:pointer;font:inherit;font-size:0.85rem;';
            btn.onclick = () => navigator.clipboard.writeText(text).then(() => alert('✅ کپی شد!'));
            const lastMsg = chatArea.lastChild;
            if (lastMsg) lastMsg.appendChild(btn);
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            const isSpellRequest = text.startsWith('ویرایش:') || text.startsWith('ویرایش ');
            addMessage(text, 'user');
            userInput.value = '';
            userInput.style.height = 'auto';

            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot-message';
            typingDiv.textContent = isSpellRequest ? '🔍 در حال ویرایش...' : '📊 در حال تحلیل...';
            chatArea.appendChild(typingDiv);
            chatArea.scrollTop = chatArea.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                chatArea.removeChild(typingDiv);

                if (data.error) {
                    addMessage('⚠️ ' + data.error, 'bot');
                } else {
                    const isCorrected = data.spell_result && data.spell_result.has_errors;
                    addMessage(data.reply, 'bot', isCorrected);
                    if (isCorrected && data.spell_result.corrected) {
                        addCopyButton(data.spell_result.corrected);
                        lastCorrectedText = data.spell_result.corrected;
                    }
                    if (data.analysis) lastAnalysis = { text, analysis: data.analysis };
                }
            } catch (err) {
                chatArea.removeChild(typingDiv);
                addMessage('❌ قطع ارتباط با سرور.', 'bot');
            }
        }

        function quickSpell() {
            const text = userInput.value.trim();
            userInput.value = text ? 'ویرایش: ' + text : 'ویرایش: ';
            userInput.focus();
            if (text) sendMessage();
        }

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        function saveToLocal() {
            if (!lastAnalysis && !lastCorrectedText) { alert('اول یک تحلیل یا ویرایش انجام بده!'); return; }
            addToHistory(lastAnalysis || { text: 'ویرایش', analysis: { corrected: lastCorrectedText } });
            alert('✅ در حافظهٔ مرورگر ذخیره شد!');
        }

        function loadHistory() {
            const history = getHistory();
            if (history.length === 0) { addMessage('📭 تاریخچه خالی است.', 'bot'); return; }
            addMessage(`📋 <b>${history.length}</b> تحلیل ذخیره شده:`, 'bot');
            history.slice(-5).forEach((item, i) => {
                const preview = item.text ? item.text.substring(0, 40) : 'بدون متن';
                addMessage(`${i + 1}. "${preview}..." (${item.analysis?.words || '?'} کلمه)`, 'bot');
            });
        }

        function exportHistory() {
            const history = getHistory();
            if (history.length === 0) { alert('تاریخچه خالی است!'); return; }
            const blob = new Blob([JSON.stringify(history, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'natiq-v7-history.json'; a.click();
            URL.revokeObjectURL(url);
            alert('📥 تاریخچه دانلود شد!');
        }

        function clearChat() {
            chatArea.innerHTML = '';
            addMessage('گفتگو پاک شد. پیام جدید بفرستید.', 'bot');
        }

        (async function healthCheck() {
            try {
                const res = await fetch('/api/health');
                const data = await res.json();
                statusBadge.textContent = 'فعال ' + data.version;
                statusBadge.style.background = 'var(--success)';
            } catch (e) {
                statusBadge.textContent = 'آفلاین';
                statusBadge.style.background = 'var(--danger)';
            }
        })();
    </script>
</body>
</html>
