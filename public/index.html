<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ناتیق ۴.۲ | Vercel Ready</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg: #0a0a1a;
            --card: rgba(255,255,255,0.05);
            --border: rgba(255,255,255,0.1);
            --text: #e0e0e0;
            --primary: #00d4ff;
            --success: #00ff88;
            --danger: #ff4444;
            --accent: #aa88ff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }
        .app {
            width: 100%;
            max-width: 900px;
            height: 95vh;
            background: var(--card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .badge {
            background: var(--success);
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
        }
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .message {
            max-width: 85%;
            padding: 12px 18px;
            border-radius: 16px;
            line-height: 1.7;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .bot-message {
            align-self: flex-start;
            background: rgba(0,212,255,0.1);
            border: 1px solid var(--primary);
        }
        .user-message {
            align-self: flex-end;
            background: var(--primary);
            color: #000;
            font-weight: 500;
        }
        .message .time {
            font-size: 0.7rem;
            opacity: 0.6;
            margin-top: 6px;
            text-align: left;
        }
        .input-area {
            padding: 1rem 1.5rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 10px;
            align-items: center;
        }
        textarea {
            flex: 1;
            height: 50px;
            max-height: 120px;
            padding: 12px 16px;
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--border);
            border-radius: 25px;
            color: var(--text);
            font: inherit;
            resize: none;
            outline: none;
            transition: 0.3s;
        }
        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,212,255,0.2);
        }
        .send-btn {
            background: var(--primary);
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .send-btn:hover { transform: scale(1.05); }
        .action-row {
            display: flex;
            gap: 8px;
            padding: 0 1.5rem 1rem;
        }
        .action-row button {
            flex: 1;
            padding: 8px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font: inherit;
            font-weight: 600;
            background: rgba(255,255,255,0.1);
            color: var(--text);
            border: 1px solid var(--border);
            transition: 0.2s;
        }
        .action-row button:hover { background: rgba(255,255,255,0.2); }
        @media (max-width: 600px) {
            .app { height: 100vh; border-radius: 0; }
        }
    </style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div style="display:flex;align-items:center;">
                <span class="logo">🧠 ناتیق ۴.۲</span>
                <span class="badge" id="statusBadge">آنلاین</span>
            </div>
            <div style="font-size:0.8rem;opacity:0.7;">☁️ Vercel Ready</div>
        </div>
        <div class="chat-area" id="chatArea">
            <div class="message bot-message">
                👋 سلام! من ناتیق هستم. هر متن فارسی بفرستی، تحلیل عمیق می‌کنم.
                <div class="time">همین الان</div>
            </div>
        </div>
        <div class="action-row">
            <button onclick="saveToLocal()">💾 ذخیره</button>
            <button onclick="loadHistory()">📋 تاریخچه</button>
            <button onclick="exportHistory()">📥 خروجی</button>
            <button onclick="clearChat()">🗑️ پاک</button>
        </div>
        <div class="input-area">
            <textarea id="userInput" placeholder="پیام خود را بنویسید..." rows="1"></textarea>
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const userInput = document.getElementById('userInput');
        const statusBadge = document.getElementById('statusBadge');
        let lastAnalysis = null;
        const STORAGE_KEY = 'natiq_history';

        function getHistory() {
            try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
            catch(e) { return []; }
        }

        function addToHistory(entry) {
            const history = getHistory();
            history.push({ ...entry, saved_at: new Date().toISOString() });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(history.slice(-50))); // نگه‌داری ۵۰ تحلیل آخر
        }

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}-message`;
            msgDiv.innerHTML = text.replace(/\n/g, '<br>');
            const timeSpan = document.createElement('div');
            timeSpan.className = 'time';
            timeSpan.textContent = new Date().toLocaleTimeString('fa-IR');
            msgDiv.appendChild(timeSpan);
            chatArea.appendChild(msgDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            addMessage(text, 'user');
            userInput.value = '';
            userInput.style.height = 'auto';

            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot-message';
            typingDiv.textContent = '... در حال تحلیل';
            chatArea.appendChild(typingDiv);
            chatArea.scrollTop = chatArea.scrollHeight;

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                chatArea.removeChild(typingDiv);
                if (data.error) {
                    addMessage('⚠️ ' + data.error, 'bot');
                } else {
                    addMessage(data.reply, 'bot');
                    if (data.analysis) {
                        lastAnalysis = { text, analysis: data.analysis };
                    }
                }
            } catch (err) {
                chatArea.removeChild(typingDiv);
                const words = text.split(/\s+/).filter(w => w.length > 0).length;
                const chars = text.replace(/\s/g, '').length;
                addMessage(`📊 آفلاین: ${words} کلمه، ${chars} کاراکتر`, 'bot');
            }
        }

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function saveToLocal() {
            if (!lastAnalysis) { alert('اول یک تحلیل انجام بده!'); return; }
            addToHistory(lastAnalysis);
            alert('✅ تحلیل در مرورگر ذخیره شد!');
        }

        function loadHistory() {
            const history = getHistory();
            if (history.length === 0) {
                addMessage('📭 تاریخچه خالی است.', 'bot');
            } else {
                addMessage(`📋 ${history.length} تحلیل ذخیره شده:`, 'bot');
                history.slice(-5).forEach((item, i) => {
                    addMessage(`${i+1}. "${item.text.substring(0, 30)}..." (${item.analysis.words} کلمه)`, 'bot');
                });
            }
        }

        function exportHistory() {
            const history = getHistory();
            if (history.length === 0) {
                alert('تاریخچه خالی است!');
                return;
            }
            const blob = new Blob([JSON.stringify(history, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'natiq-history.json';
            a.click();
            URL.revokeObjectURL(url);
            alert('📥 تاریخچه دانلود شد!');
        }

        function clearChat() {
            chatArea.innerHTML = '';
            addMessage('گفتگو پاک شد.', 'bot');
        }

        (async function healthCheck() {
            try {
                const res = await fetch('/api/health');
                await res.json();
                statusBadge.textContent = 'فعال';
                statusBadge.style.background = 'var(--success)';
            } catch (e) {
                statusBadge.textContent = 'آفلاین';
                statusBadge.style.background = 'var(--danger)';
            }
        })();
    </script>
</body>
</html>
