<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ناتیق اولتیمیت | پردازش متن فارسی</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg: #0f172a;
            --card: rgba(255,255,255,0.05);
            --border: rgba(255,255,255,0.08);
            --text: #e2e8f0;
            --primary: #38bdf8;
            --success: #4ade80;
            --danger: #f87171;
            --accent: #a78bfa;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
            --radius: 24px;
        }
        .light-mode {
            --bg: #f1f5f9;
            --card: rgba(255,255,255,0.8);
            --border: rgba(0,0,0,0.08);
            --text: #1e293b;
            --shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
        }
        .container {
            width: 100%;
            max-width: 850px;
            background: var(--card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: var(--shadow);
            transition: all 0.3s;
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .meta-badges {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 1rem 0;
        }
        .badge {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border);
            padding: 6px 18px;
            border-radius: 50px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .badge.status-dot::before {
            content: "";
            width: 10px;
            height: 10px;
            background: var(--success);
            border-radius: 50%;
            display: inline-block;
        }
        .theme-toggle {
            position: absolute;
            top: 0;
            left: 0;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text);
            opacity: 0.7;
            background: var(--card);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
        }
        .theme-toggle:hover { opacity: 1; }
        .input-section {
            background: rgba(0,0,0,0.1);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }
        textarea {
            width: 100%;
            height: 180px;
            padding: 1rem;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border);
            border-radius: 16px;
            color: var(--text);
            font: inherit;
            font-size: 1.05rem;
            resize: vertical;
            transition: 0.3s;
            line-height: 1.8;
        }
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(56,189,248,0.2);
        }
        .live-stats {
            display: flex;
            justify-content: flex-start;
            gap: 20px;
            margin-top: 12px;
            font-size: 0.9rem;
            color: var(--primary);
            flex-wrap: wrap;
        }
        .action-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }
        button {
            flex: 1;
            min-width: 120px;
            padding: 14px 20px;
            border: none;
            border-radius: 16px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            background: var(--primary);
            color: #0f172a;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(56,189,248,0.3);
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(56,189,248,0.4); }
        button.secondary {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border);
            color: var(--text);
            box-shadow: none;
        }
        button.secondary:hover { background: rgba(255,255,255,0.15); }
        button.danger {
            background: var(--danger);
            color: white;
            box-shadow: 0 4px 12px rgba(248,113,113,0.3);
        }
        .result-card {
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
            padding: 1.5rem;
            border: 1px solid var(--border);
            display: none;
            animation: fadeSlide 0.4s ease;
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .copy-btn {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 5px;
            border-radius: 8px;
        }
        .copy-btn:hover { background: rgba(255,255,255,0.1); }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 1rem;
        }
        .stat-item {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .stat-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary);
        }
        .stat-label { font-size: 0.85rem; opacity: 0.8; }
        .freq-table {
            width: 100%;
            margin-top: 1rem;
            border-collapse: collapse;
            font-size: 0.95rem;
        }
        .freq-table th, .freq-table td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            text-align: right;
        }
        .freq-table th { color: var(--primary); font-weight: 600; }
        .progress-bar {
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 5px;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 3px;
            width: 0%;
            transition: width 0.4s;
        }
        footer {
            text-align: center;
            margin-top: 2rem;
            opacity: 0.6;
            font-size: 0.9rem;
        }
        @media (max-width: 600px) {
            .container { padding: 1.5rem; }
            h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <button class="theme-toggle" id="themeToggle" title="تغییر تم">🌓</button>
            <h1>ناتیق اولتیمیت 🏆</h1>
            <div class="meta-badges">
                <span class="badge status-dot" id="statusBadge">فعال</span>
                <span class="badge">ورژن ۲.۰</span>
                <span class="badge">صفحه ۲۱۸</span>
            </div>
        </header>

        <div class="input-section">
            <textarea id="textInput" placeholder="متن فارسی خود را اینجا بنویسید..."></textarea>
            <div class="live-stats">
                <span id="liveChars">۰ کاراکتر</span>
                <span id="liveWords">۰ کلمه</span>
            </div>
        </div>

        <div class="action-buttons">
            <button id="analyzeBtn">✨ تحلیل متن</button>
            <button id="healthBtn" class="secondary">💚 سلامت سیستم</button>
            <button id="clearBtn" class="danger">🗑️ پاکسازی</button>
        </div>

        <div class="result-card" id="resultCard">
            <div class="result-header">
                <strong style="font-size:1.2rem;">📊 نتایج تحلیل</strong>
                <button class="copy-btn" id="copyResult" title="کپی نتایج">📋</button>
            </div>
            <div id="resultContent"></div>
        </div>

        <footer>سیستم پردازش زبان فارسی | ناتیق اولتیمیت</footer>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const liveChars = document.getElementById('liveChars');
        const liveWords = document.getElementById('liveWords');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const healthBtn = document.getElementById('healthBtn');
        const clearBtn = document.getElementById('clearBtn');
        const resultCard = document.getElementById('resultCard');
        const resultContent = document.getElementById('resultContent');
        const copyBtn = document.getElementById('copyResult');
        const themeToggle = document.getElementById('themeToggle');
        const statusBadge = document.getElementById('statusBadge');

        const getTextStats = (text) => {
            const words = text.trim().split(/\s+/).filter(w => w.length > 0);
            const charsNoSpace = text.replace(/\s/g, '').length;
            const sentences = text.split(/[.!?؟\n]+/).filter(s => s.trim().length > 0);
            const longest = words.reduce((a,b) => a.length > b.length ? a : b, '');
            const shortest = words.reduce((a,b) => a.length < b.length ? a : b, '');
            const avgLen = words.length ? (charsNoSpace / words.length).toFixed(1) : 0;
            const readingTime = Math.ceil(words.length / 200);
            const uniqueWords = new Set(words.map(w => w.replace(/[،؛,.?!]/g, ''))).size;
            const freqMap = {};
            words.forEach(w => {
                const clean = w.replace(/[،؛,.?!]/g, '');
                if (clean.length >= 2) freqMap[clean] = (freqMap[clean] || 0) + 1;
            });
            const sortedFreq = Object.entries(freqMap)
                .sort((a,b) => b[1] - a[1])
                .slice(0, 5);
            return { words: words.length, chars: charsNoSpace, sentences: sentences.length,
                avgLen, longest, shortest, readingTime, uniqueWords, freq: sortedFreq };
        };

        const renderResults = (apiData = null, offlineStats = null) => {
            let html = '';
            if (apiData && apiData.success) {
                const a = apiData.analysis;
                const stats = getTextStats(textInput.value);
                html = `
                <div class="grid">
                    <div class="stat-item"><div class="stat-value">${a.words}</div><div class="stat-label">کلمات</div></div>
                    <div class="stat-item"><div class="stat-value">${a.characters}</div><div class="stat-label">کاراکتر (بدون فاصله)</div></div>
                    <div class="stat-item"><div class="stat-value">${a.sentences || stats.sentences}</div><div class="stat-label">جمله</div></div>
                    <div class="stat-item"><div class="stat-value">${a.average_word_length}</div><div class="stat-label">طول میانگین کلمه</div></div>
                    <div class="stat-item"><div class="stat-value">${stats.readingTime} دقیقه</div><div class="stat-label">زمان مطالعه</div></div>
                    <div class="stat-item"><div class="stat-value">${stats.uniqueWords}</div><div class="stat-label">کلمات یکتا</div></div>
                </div>
                <p style="margin-top:1rem;"><strong>بلندترین کلمه:</strong> ${a.longest_word || stats.longest} | <strong>کوتاه‌ترین:</strong> ${a.shortest_word || stats.shortest}</p>
                <h3 style="margin-top:1.5rem;">🔠 پرتکرارترین کلمات</h3>
                <table class="freq-table">
                    <thead><tr><th>کلمه</th><th>تعداد</th><th>درصد</th></tr></thead>
                    <tbody>
                        ${stats.freq.map(([word, count]) => {
                            const percent = ((count / stats.words)*100).toFixed(1);
                            return `<tr>
                                <td>${word}</td>
                                <td>${count}</td>
                                <td>
                                    <div style="display:flex;align-items:center;gap:8px;">
                                        <span>${percent}%</span>
                                        <div class="progress-bar" style="flex:1;"><div class="progress-fill" style="width:${percent}%"></div></div>
                                    </div>
                                </td>
                            </tr>`;
                        }).join('')}
                    </tbody>
                </table>
                <p style="font-size:0.8rem;margin-top:0.5rem;">(${stats.freq.length} کلمه از ${stats.uniqueWords} کلمه یکتا)</p>
                <p style="opacity:0.7;margin-top:1rem;"><small>ورژن ${apiData.version} | صفحه ${apiData.page} | تحلیل آنلاین</small></p>`;
            } else if (offlineStats) {
                const s = offlineStats;
                html = `
                <div class="grid">
                    <div class="stat-item"><div class="stat-value">${s.words}</div><div class="stat-label">کلمات</div></div>
                    <div class="stat-item"><div class="stat-value">${s.chars}</div><div class="stat-label">کاراکتر</div></div>
                    <div class="stat-item"><div class="stat-value">${s.sentences}</div><div class="stat-label">جمله</div></div>
                    <div class="stat-item"><div class="stat-value">${s.avgLen}</div><div class="stat-label">میانگین طول</div></div>
                    <div class="stat-item"><div class="stat-value">${s.readingTime} دقیقه</div><div class="stat-label">زمان مطالعه</div></div>
                    <div class="stat-item"><div class="stat-value">${s.uniqueWords}</div><div class="stat-label">کلمات یکتا</div></div>
                </div>
                <p style="margin-top:1rem;"><strong>بلندترین کلمه:</strong> ${s.longest} | <strong>کوتاه‌ترین:</strong> ${s.shortest}</p>
                <h3 style="margin-top:1.5rem;">🔠 پرتکرارترین کلمات</h3>
                <table class="freq-table">
                    <thead><tr><th>کلمه</th><th>تعداد</th><th>درصد</th></tr></thead>
                    <tbody>
                        ${s.freq.map(([word, count]) => {
                            const percent = ((count / s.words)*100).toFixed(1);
                            return `<tr><td>${word}</td><td>${count}</td><td>${percent}%</td></tr>`;
                        }).join('')}
                    </tbody>
                </table>
                <p style="opacity:0.7;margin-top:1rem;"><small>تحلیل آفلاین (سرور در دسترس نیست) | ورژن ۲.۰ | صفحه ۲۱۸</small></p>`;
            } else {
                html = '<p style="color:var(--danger);">خطا در دریافت نتایج.</p>';
            }
            resultContent.innerHTML = html;
            resultCard.style.display = 'block';
        };

        const analyzeText = async () => {
            const text = textInput.value.trim();
            if (!text) {
                alert('لطفاً متنی وارد کنید.');
                return;
            }
            resultCard.style.display = 'none';
            try {
                const res = await fetch('/api/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });
                const data = await res.json();
                if (data.success) {
                    renderResults(data);
                } else {
                    const stats = getTextStats(text);
                    renderResults(null, stats);
                }
            } catch (e) {
                const stats = getTextStats(text);
                renderResults(null, stats);
            }
        };

        const checkHealth = async () => {
            resultCard.style.display = 'none';
            try {
                const res = await fetch('/api/health');
                const data = await res.json();
                statusBadge.innerHTML = '✅ فعال';
                statusBadge.style.color = 'var(--success)';
                resultContent.innerHTML = `<p>✅ سرور فعال است</p>
                    <p><strong>نام:</strong> ${data.name} | <strong>ورژن:</strong> ${data.version} | <strong>صفحه:</strong> ${data.page}</p>
                    <p><strong>زمان سرور:</strong> ${data.timestamp}</p>
                    <p><strong>وضعیت:</strong> ${data.status}</p>`;
                resultCard.style.display = 'block';
            } catch (e) {
                statusBadge.innerHTML = '⚠️ آفلاین';
                statusBadge.style.color = 'var(--danger)';
                resultContent.innerHTML = '<p style="color:var(--danger);">⚠️ ارتباط با سرور برقرار نشد. تحلیل‌ها به صورت محلی انجام می‌شود.</p>';
                resultCard.style.display = 'block';
            }
        };

        analyzeBtn.addEventListener('click', analyzeText);
        healthBtn.addEventListener('click', checkHealth);
        clearBtn.addEventListener('click', () => {
            textInput.value = '';
            resultCard.style.display = 'none';
            updateLiveStats();
        });

        textInput.addEventListener('input', updateLiveStats);
        function updateLiveStats() {
            const text = textInput.value;
            const words = text.trim().split(/\s+/).filter(w => w.length > 0).length;
            const chars = text.replace(/\s/g, '').length;
            liveChars.textContent = `${chars.toLocaleString('fa-IR')} کاراکتر`;
            liveWords.textContent = `${words.toLocaleString('fa-IR')} کلمه`;
        }

        copyBtn.addEventListener('click', () => {
            const textToCopy = resultContent.innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('نتایج با موفقیت کپی شد.');
            }).catch(() => alert('خطا در کپی نتایج.'));
        });

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            themeToggle.textContent = isLight ? '☀️' : '🌙';
        });

        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-mode');
            themeToggle.textContent = '☀️';
        } else {
            document.body.classList.remove('light-mode');
            themeToggle.textContent = '🌙';
        }

        checkHealth();
        updateLiveStats();
    </script>
</body>
</html>
