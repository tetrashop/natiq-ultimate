<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ناتیق اولتیمیت ۳.۰ | تحلیل عمیق متن فارسی</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg: #0a0a1a;
            --card: rgba(255,255,255,0.05);
            --border: rgba(255,255,255,0.1);
            --text: #e0e0e0;
            --primary: #00d4ff;
            --success: #00ff88;
            --warning: #ffaa00;
            --danger: #ff4444;
            --accent: #aa88ff;
            --shadow: 0 8px 32px rgba(0,0,0,0.6);
            --radius: 20px;
        }
        .light-mode {
            --bg: #f0f4ff;
            --card: rgba(255,255,255,0.9);
            --border: rgba(0,0,0,0.1);
            --text: #1a1a2e;
            --shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: all 0.3s;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: var(--shadow);
            transition: all 0.3s;
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
            position: relative;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .meta-badges {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 1rem 0;
        }
        .badge {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .badge.status-dot::before {
            content: "";
            width: 10px;
            height: 10px;
            background: var(--success);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .theme-toggle {
            position: absolute;
            top: 0;
            left: 0;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text);
            opacity: 0.7;
            background: var(--card);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
        }
        .theme-toggle:hover { opacity: 1; }
        .input-section {
            background: rgba(0,0,0,0.15);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border);
        }
        textarea {
            width: 100%;
            height: 160px;
            padding: 1rem;
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font: inherit;
            font-size: 1rem;
            resize: vertical;
            transition: 0.3s;
            line-height: 1.8;
        }
        textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,212,255,0.2);
        }
        .live-stats {
            display: flex;
            justify-content: flex-start;
            gap: 20px;
            margin-top: 12px;
            font-size: 0.9rem;
            color: var(--primary);
            flex-wrap: wrap;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }
        button {
            flex: 1;
            min-width: 120px;
            padding: 14px 20px;
            border: none;
            border-radius: 14px;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-primary {
            background: var(--primary);
            color: #0a0a1a;
            box-shadow: 0 4px 16px rgba(0,212,255,0.3);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,212,255,0.5); }
        .btn-deep {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 16px rgba(170,136,255,0.3);
        }
        .btn-deep:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(170,136,255,0.5); }
        .btn-secondary {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); }
        .btn-danger {
            background: var(--danger);
            color: white;
            box-shadow: 0 4px 16px rgba(255,68,68,0.3);
        }
        .btn-danger:hover { transform: translateY(-2px); }
        .result-card {
            background: rgba(0,0,0,0.2);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid var(--border);
            display: none;
            animation: fadeSlide 0.5s ease;
        }
        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 10px;
        }
        .copy-btn {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-size: 1.2rem;
            padding: 8px;
            border-radius: 8px;
        }
        .copy-btn:hover { background: rgba(255,255,255,0.1); }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin: 1rem 0;
        }
        .stat-item {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            border: 1px solid var(--border);
        }
        .stat-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
        }
        .stat-label { font-size: 0.8rem; opacity: 0.8; margin-top: 4px; }
        .freq-table {
            width: 100%;
            margin-top: 1rem;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .freq-table th, .freq-table td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            text-align: right;
        }
        .freq-table th { color: var(--primary); font-weight: 600; }
        .progress-bar {
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 4px;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 3px;
            width: 0%;
            transition: width 0.5s ease;
        }
        .badge-result {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin: 4px;
        }
        .badge-positive { background: rgba(0,255,136,0.2); color: var(--success); }
        .badge-negative { background: rgba(255,68,68,0.2); color: var(--danger); }
        .badge-neutral { background: rgba(255,255,255,0.1); color: var(--text); }
        footer {
            text-align: center;
            margin-top: 2rem;
            opacity: 0.5;
            font-size: 0.85rem;
        }
        @media (max-width: 600px) {
            .container { padding: 1.2rem; }
            h1 { font-size: 1.7rem; }
            button { font-size: 0.85rem; padding: 12px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <button class="theme-toggle" id="themeToggle" title="تغییر تم">🌓</button>
            <h1>ناتیق اولتیمیت ۳.۰ 🧠</h1>
            <div class="meta-badges">
                <span class="badge status-dot" id="statusBadge">فعال</span>
                <span class="badge">ورژن ۳.۰</span>
                <span class="badge">صفحه ۲۱۸</span>
                <span class="badge">Deep Learning</span>
            </div>
        </header>

        <div class="input-section">
            <textarea id="textInput" placeholder="متن فارسی خود را اینجا بنویسید..."></textarea>
            <div class="live-stats">
                <span id="liveChars">۰ کاراکتر</span>
                <span id="liveWords">۰ کلمه</span>
                <span id="liveSentences">۰ جمله</span>
            </div>
        </div>

        <div class="action-buttons">
            <button class="btn-primary" id="analyzeBtn">✨ تحلیل پایه</button>
            <button class="btn-deep" id="deepAnalyzeBtn">🧠 تحلیل عمیق</button>
            <button class="btn-secondary" id="healthBtn">💚 سلامت</button>
            <button class="btn-danger" id="clearBtn">🗑️ پاک</button>
        </div>

        <div class="result-card" id="resultCard">
            <div class="result-header">
                <strong style="font-size:1.2rem;">📊 نتایج</strong>
                <button class="copy-btn" id="copyResult" title="کپی نتایج">📋</button>
            </div>
            <div id="resultContent"></div>
        </div>

        <footer>سیستم تحلیل عمیق زبان فارسی | ناتیق اولتیمیت ۳.۰ | صفحه ۲۱۸</footer>
    </div>

    <script>
        const textInput = document.getElementById('textInput');
        const liveChars = document.getElementById('liveChars');
        const liveWords = document.getElementById('liveWords');
        const liveSentences = document.getElementById('liveSentences');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const deepAnalyzeBtn = document.getElementById('deepAnalyzeBtn');
        const healthBtn = document.getElementById('healthBtn');
        const clearBtn = document.getElementById('clearBtn');
        const resultCard = document.getElementById('resultCard');
        const resultContent = document.getElementById('resultContent');
        const copyBtn = document.getElementById('copyResult');
        const themeToggle = document.getElementById('themeToggle');
        const statusBadge = document.getElementById('statusBadge');

        // ---------- آمار زنده ----------
        function updateLiveStats() {
            const text = textInput.value;
            const words = text.trim().split(/\s+/).filter(w => w.length > 0).length;
            const chars = text.replace(/\s/g, '').length;
            const sentences = text.split(/[.!?؟\n]+/).filter(s => s.trim().length > 0).length;
            liveChars.textContent = `${chars.toLocaleString('fa-IR')} کاراکتر`;
            liveWords.textContent = `${words.toLocaleString('fa-IR')} کلمه`;
            liveSentences.textContent = `${sentences.toLocaleString('fa-IR')} جمله`;
        }
        textInput.addEventListener('input', updateLiveStats);

        // ---------- تحلیل آفلاین ----------
        function offlineAnalyze(text) {
            const words = text.trim().split(/\s+/).filter(w => w.length > 0);
            const chars = text.replace(/\s/g, '').length;
            const sentences = text.split(/[.!?؟\n]+/).filter(s => s.trim().length > 0);
            const longest = words.reduce((a,b) => a.length > b.length ? a : b, '');
            const shortest = words.reduce((a,b) => a.length < b.length ? a : b, '');
            const avgLen = words.length ? (chars / words.length).toFixed(1) : 0;
            const readingTime = Math.ceil(words.length / 200);
            const uniqueWords = new Set(words.map(w => w.replace(/[،؛,.?!:؛«»()"']/g, '').trim()).filter(w => w.length > 0));
            const freqMap = {};
            words.forEach(w => {
                const clean = w.replace(/[،؛,.?!:؛«»()"']/g, '').trim();
                if (clean.length >= 2) freqMap[clean] = (freqMap[clean] || 0) + 1;
            });
            const sortedFreq = Object.entries(freqMap).sort((a,b) => b[1] - a[1]).slice(0, 10);
            const ttr = words.length > 0 ? uniqueWords.size / words.length : 0;
            let textType = 'عمومی';
            if (avgLen > 7) textType = 'رسمی / علمی';
            else if (avgLen > 5) textType = 'نیمه‌رسمی';
            else if (avgLen > 3) textType = 'محاوره‌ای';
            return { words: words.length, chars, sentences: sentences.length, avgLen, longest, shortest, readingTime, uniqueWords: uniqueWords.size, freq: sortedFreq, ttr, textType };
        }

        // ---------- رندر نتایج پایه ----------
        function renderBasicResult(data) {
            const a = data.analysis;
            const stats = offlineAnalyze(textInput.value);
            return `
                <div class="grid">
                    <div class="stat-item"><div class="stat-value">${a.words}</div><div class="stat-label">کلمات</div></div>
                    <div class="stat-item"><div class="stat-value">${a.characters}</div><div class="stat-label">کاراکتر (بدون فاصله)</div></div>
                    <div class="stat-item"><div class="stat-value">${a.sentences}</div><div class="stat-label">جملات</div></div>
                    <div class="stat-item"><div class="stat-value">${a.average_word_length}</div><div class="stat-label">میانگین طول کلمه</div></div>
                    <div class="stat-item"><div class="stat-value">${stats.readingTime} دقیقه</div><div class="stat-label">زمان مطالعه</div></div>
                    <div class="stat-item"><div class="stat-value">${stats.uniqueWords}</div><div class="stat-label">کلمات یکتا</div></div>
                </div>
                <p style="margin-top:1rem;"><strong>بلندترین:</strong> ${a.longest_word} | <strong>کوتاه‌ترین:</strong> ${a.shortest_word}</p>
                <p style="opacity:0.7;margin-top:0.5rem;"><small>ورژن ${data.version} | صفحه ${data.page}</small></p>`;
        }

        // ---------- رندر نتایج عمیق ----------
        function renderDeepResult(data) {
            const d = data;
            const sentimentClass = d.sentiment.label === 'مثبت' ? 'badge-positive' : d.sentiment.label === 'منفی' ? 'badge-negative' : 'badge-neutral';
            return `
                <h3 style="color:var(--accent);margin-bottom:1rem;">🧠 تحلیل عمیق</h3>
                <div class="grid">
                    <div class="stat-item"><div class="stat-value">${d.analysis.words}</div><div class="stat-label">کلمات</div></div>
                    <div class="stat-item"><div class="stat-value">${d.analysis.characters}</div><div class="stat-label">کاراکتر</div></div>
                    <div class="stat-item"><div class="stat-value">${d.sentence_analysis.count}</div><div class="stat-label">جملات</div></div>
                    <div class="stat-item"><div class="stat-value">${d.analysis.average_word_length}</div><div class="stat-label">میانگین طول کلمه</div></div>
                    <div class="stat-item"><div class="stat-value">${d.unique_word_count}</div><div class="stat-label">کلمات یکتا</div></div>
                    <div class="stat-item"><div class="stat-value">${d.reading_time_minutes} دقیقه</div><div class="stat-label">زمان مطالعه</div></div>
                </div>
                <div style="margin:1rem 0;">
                    <span class="badge-result">📝 نوع متن: ${d.text_type}</span>
                    <span class="badge-result ${sentimentClass}">💬 احساس: ${d.sentiment.label} (${d.sentiment.positive_words}+ / ${d.sentiment.negative_words}-)</span>
                    <span class="badge-result">📖 خوانایی: ${d.readability.level} (${d.readability.score}%)</span>
                    <span class="badge-result">📊 غنای واژگانی: ${d.lexical_richness.interpretation} (TTR: ${d.lexical_richness.ttr})</span>
                </div>
                <h4 style="margin-top:1rem;">🔠 پرتکرارترین کلمات</h4>
                <table class="freq-table">
                    <thead><tr><th>کلمه</th><th>تعداد</th><th>درصد</th></tr></thead>
                    <tbody>
                        ${d.frequency.map(([word, count]) => {
                            const percent = ((count / d.analysis.words)*100).toFixed(1);
                            return `<tr><td>${word}</td><td>${count}</td><td><div style="display:flex;align-items:center;gap:8px;"><span>${percent}%</span><div class="progress-bar" style="flex:1;"><div class="progress-fill" style="width:${percent}%"></div></div></div></td></tr>`;
                        }).join('')}
                    </tbody>
                </table>
                <h4 style="margin-top:1rem;">🔤 پرتکرارترین حروف</h4>
                <p>${d.top_characters.map(([c, n]) => `${c}: ${n}`).join(' | ')}</p>
                <h4 style="margin-top:1rem;">📏 تحلیل جملات</h4>
                <p>بلندترین جمله: ${d.sentence_analysis.longest} کلمه | کوتاه‌ترین: ${d.sentence_analysis.shortest} | میانگین: ${d.sentence_analysis.average_length}</p>
                <p style="opacity:0.7;margin-top:1rem;"><small>ورژن ${d.metadata.version} | صفحه ${d.metadata.page} | ${d.metadata.processed_at}</small></p>`;
        }

        // ---------- فراخوانی API پایه ----------
        async function analyzeText() {
            const text = textInput.value.trim();
            if (!text) { alert('لطفاً متنی وارد کنید.'); return; }
            resultCard.style.display = 'none';
            try {
                const res = await fetch('/api/process', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
                const data = await res.json();
                resultContent.innerHTML = data.success ? renderBasicResult(data) : renderBasicResult({ analysis: offlineAnalyze(text), version: 'آفلاین', page: '۲۱۸' });
                resultCard.style.display = 'block';
            } catch (e) {
                resultContent.innerHTML = renderBasicResult({ analysis: offlineAnalyze(text), version: 'آفلاین', page: '۲۱۸' });
                resultCard.style.display = 'block';
            }
        }

        // ---------- فراخوانی API عمیق ----------
        async function deepAnalyzeText() {
            const text = textInput.value.trim();
            if (!text) { alert('لطفاً متنی وارد کنید.'); return; }
            resultCard.style.display = 'none';
            try {
                const res = await fetch('/api/deep', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
                const data = await res.json();
                resultContent.innerHTML = data.success ? renderDeepResult(data) : '<p style="color:var(--danger);">خطا در تحلیل عمیق.</p>';
                resultCard.style.display = 'block';
            } catch (e) {
                resultContent.innerHTML = '<p style="color:var(--danger);">⚠️ ارتباط با سرور برقرار نشد. تحلیل عمیق نیاز به سرور دارد.</p>';
                resultCard.style.display = 'block';
            }
        }

        // ---------- سلامت ----------
        async function checkHealth() {
            resultCard.style.display = 'none';
            try {
                const res = await fetch('/api/health');
                const data = await res.json();
                statusBadge.innerHTML = '✅ فعال';
                resultContent.innerHTML = `<p>✅ سرور فعال | ${data.name} | ورژن ${data.version} | صفحه ${data.page}</p><p>زمان: ${data.timestamp}</p>`;
                resultCard.style.display = 'block';
            } catch (e) {
                statusBadge.innerHTML = '⚠️ آفلاین';
                resultContent.innerHTML = '<p style="color:var(--danger);">⚠️ سرور در دسترس نیست.</p>';
                resultCard.style.display = 'block';
            }
        }

        // ---------- event listeners ----------
        analyzeBtn.addEventListener('click', analyzeText);
        deepAnalyzeBtn.addEventListener('click', deepAnalyzeText);
        healthBtn.addEventListener('click', checkHealth);
        clearBtn.addEventListener('click', () => { textInput.value = ''; resultCard.style.display = 'none'; updateLiveStats(); });
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(resultContent.innerText).then(() => alert('نتایج کپی شد!')).catch(() => alert('خطا در کپی'));
        });
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            themeToggle.textContent = isLight ? '☀️' : '🌙';
        });
        if (localStorage.getItem('theme') === 'light') { document.body.classList.add('light-mode'); themeToggle.textContent = '☀️'; }
        else { themeToggle.textContent = '🌙'; }

        checkHealth();
        updateLiveStats();
    </script>
</body>
</html>
